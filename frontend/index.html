<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Rewriter</title>
<style>
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --ink:#141a1f; --muted:#69727e; --faint:#9aa3ad;
    --line:#e7eaee; --accent:#2f6fed; --accent-weak:#e9f0fe;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
         -webkit-font-smoothing:antialiased; }

  header.top { flex:none; display:flex; align-items:center; gap:14px; padding:11px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); }
  header.top .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:14.5px;
    white-space:nowrap; }
  header.top .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  header.top .spacer { flex:1; }
  header.top button.reload { font:inherit; font-size:12.5px; border:1px solid var(--line);
    background:#fff; color:var(--muted); border-radius:8px; padding:6px 10px; cursor:pointer; }
  header.top button.reload:hover { border-color:#cfd5dd; color:var(--ink); }

  nav#tabbar { flex:none; display:flex; gap:2px; padding:0 14px; background:var(--panel);
    border-bottom:1px solid var(--line); }
  nav#tabbar button { font:inherit; font-size:13px; font-weight:650; color:var(--muted);
    background:none; border:none; border-bottom:3px solid transparent; padding:11px 14px 9px;
    cursor:pointer; white-space:nowrap; }
  nav#tabbar button:hover { color:var(--ink); }
  nav#tabbar button.active { color:var(--accent); border-bottom-color:var(--accent); }

  #frames { flex:1; min-height:0; position:relative; }
  iframe.tab-frame { position:absolute; inset:0; width:100%; height:100%; border:none; display:none; }
  iframe.tab-frame.show { display:block; }

  /* ------------------------- dark mode ------------------------- */
  @media (prefers-color-scheme: dark) {
  :root { --bg:#14171b; --panel:#1b1f26; --ink:#e7eaef; --muted:#98a2ae; --faint:#6c7683;
    --line:#2b313a; --accent:#5b8def; --accent-weak:#1e2a44; }
  header.top button.reload { background:#22272f; color:var(--muted); }
  header.top button.reload:hover { border-color:#3a4452; color:var(--ink); }
  }
</style>
</head>
<body>
  <header class="top">
    <span class="brand"><span class="dot"></span> Resume Rewriter</span>
    <nav id="tabbar"></nav>
    <span class="spacer"></span>
    <button class="reload" id="reloadBtn" title="Reload the current tab's content">↻ Reload</button>
  </header>
  <div id="frames"></div>

<script>
// Each top-level tab owns one iframe (kept alive across switches so scroll/form state survives).
// "linkedin" has a sub-page (startups.html <-> outreach.html) selected via a second hash segment,
// since those two pages cross-link each other but both belong under one tab.
const TABS = [
  { id:"resume",       label:"📝 Resume",       src:"resume.html" },
  { id:"applications", label:"📊 Applications", src:"dashboard.html" },
  { id:"chat",         label:"💬 AI Chat",      src:"ai-ask.html" },
  { id:"linkedin",     label:"🚀 LinkedIn + Startups", src:"startups.html",
    alt:{ outreach:"outreach.html" } },
];

const tabbar = document.getElementById("tabbar");
const framesBox = document.getElementById("frames");
const frames = {};

TABS.forEach(t => {
  const btn = document.createElement("button");
  btn.dataset.tab = t.id;
  btn.textContent = t.label;
  btn.addEventListener("click", () => { location.hash = "#" + t.id; });
  tabbar.appendChild(btn);
});

function activate(tabId, sub) {
  const t = TABS.find(x => x.id === tabId) || TABS[0];
  [...tabbar.children].forEach(b => b.classList.toggle("active", b.dataset.tab === t.id));
  const src = (t.alt && sub && t.alt[sub]) ? t.alt[sub] : t.src;

  let frame = frames[t.id];
  if (!frame) {
    frame = document.createElement("iframe");
    frame.className = "tab-frame";
    frame.src = src;
    frame.dataset.src = src;
    framesBox.appendChild(frame);
    frames[t.id] = frame;
  } else if (frame.dataset.src !== src) {
    frame.src = src;
    frame.dataset.src = src;
  }
  Object.values(frames).forEach(f => f.classList.toggle("show", f === frame));
  return frame;
}

function fromHash() {
  const [tabId, sub] = (location.hash.slice(1) || "resume").split("/");
  activate(tabId, sub);
}
window.addEventListener("hashchange", fromHash);

document.getElementById("reloadBtn").addEventListener("click", () => {
  const [tabId] = (location.hash.slice(1) || "resume").split("/");
  const frame = frames[tabId];
  if (frame) frame.src = frame.src;
});

fromHash();
</script>
</body>
</html>
